<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Black Iron TV</title>
<link rel="icon" href="/images/anvil-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/tv/tv.css">
</head>
<body>
<!-- The gym TV display. Content lives in /tv/config.js; see /tv/README.md. -->
<div id="viewport">
  <div id="stage" class="sk-right">
    <div id="glow" class="amb"></div>
    <div id="skullWrap"><img src="/images/tv/skull.png" alt=""></div>
    <div class="layer" id="L0"></div>
    <div class="layer" id="L1"></div>
    <div id="vignette" class="amb"></div>
    <div id="grain" class="amb"></div>
    <div class="bar" id="barTop"><div class="spark"></div></div>
    <div class="bar" id="barBot"><div class="spark"></div></div>
    <div id="dots"></div>
    <div id="stamp"></div>
    <div id="offline">OFFLINE</div>
    <div id="boot"><img src="/images/logos/Anvil-WHITE.png" alt=""></div>
  </div>
</div>
<script src="/tv/config.js"></script>
<script src="/tv/tv.js"></script>
</body>
</html>
