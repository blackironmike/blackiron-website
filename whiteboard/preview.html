<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coach Board Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap">
<style>
body{margin:0;background:#000;color:#C7C7C7;font-family:Montserrat,Arial,sans-serif;padding:40px 5vw 80px}
h1{color:#fff;font-weight:900;text-transform:uppercase;font-size:clamp(28px,4vw,52px);margin:0 0 6px}
h2{color:#FFD202;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:15px;margin:48px 0 6px}
h3{color:#fff;font-weight:900;text-transform:uppercase;font-size:26px;margin:0 0 6px}
p{max-width:820px;line-height:1.5;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
a.t{display:block;text-decoration:none;color:#C7C7C7;border:1px solid #2A2A2A;background:#101010}
a.t:hover{border-color:#FFD202}
.f{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000}
.f iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.c{padding:12px 14px;font-weight:700;font-size:14px}
.c b{color:#fff;display:block;font-size:16px;text-transform:uppercase}
</style>
</head>
<body>
<h1>Coach board</h1>
<p>The whiteboard layout. Every tile opens the real board: click through sections, start the clock, try Clock settings and Auto clock. Keyboard or clicker: arrows for sections, space to start or pause, C for clock settings, A for auto clock. Programming shown is the week of Oct 12.</p>
<div id="out"></div>
<script>
var BOARD = [
  ['Warm up', 'Opens here after the welcome. The text sizes itself to fill the board.', 'date=2026-10-19&mode=board&class=9:30&section=1'],
  ['Weightlifting, prep running', 'The section opens with the prep timer: brief, load, set up. Its own clock starts when prep hits zero.', 'date=2026-10-19&mode=board&class=9:30&section=3'],
  ['Conditioning', 'Prep reminds the room: strip the bar, water and bathroom, set up.', 'date=2026-10-19&mode=board&class=9:30&section=4'],
  ['Body building', 'Four pieces on a Thursday, shorter prep.', 'date=2026-10-15&mode=board&class=9:30&section=3'],
  ['Cool down', 'Up to five minutes, so the class lands on the hour.', 'date=2026-10-19&mode=board&class=9:30&section=5'],
  ['Great work', 'Plays when the last clock ends or the coach taps Finish.', 'date=2026-10-19&mode=board&class=9:30&section=5&celebrate=1']
];
var SHARED = [
  ['Time until next class', 'Between classes, and from 4:15 AM before the first class.', 'date=2026-10-12&time=08:14'],
  ['Welcome, then the warm-up', 'Plays at the start of each class.', 'date=2026-10-15&time=09:29:55'],
  ['Open gym: today’s workout', 'Opens the whiteboard as a one-hour class with Auto clock on. Start workout runs the whole thing.', 'date=2026-10-12&time=08:14&mode=opengym']
];
var END = [
  ['End of day', 'After the last class and overnight: the time, then the next class.', 'date=2026-10-12&time=21:05'],
  ['Weekend', 'Saturday after the 9:30 class and all day Sunday.', 'date=2026-10-17&time=12:05']
];
function tile(href, title, sub) {
  return '<a class="t" href="/whiteboard/?' + href + '" target="_blank"><div class="f"><iframe loading="lazy" src="/whiteboard/?' + href + '&still=1&wx=72" tabindex="-1"></iframe></div><div class="c"><b>' + title + '</b>' + (sub || '') + '</div></a>';
}
function grid(list) { return '<div class="grid">' + list.map(function (s) { return tile(s[2], s[0], s[1]); }).join('') + '</div>'; }
document.getElementById('out').innerHTML =
  '<h2>During class</h2><h3>The whiteboard</h3>' + grid(BOARD) +
  '<h2>Between classes</h2><h3>Countdown, welcome and open gym</h3>' + grid(SHARED) +
  '<h2>After hours</h2><h3>End of day and weekend</h3>' + grid(END);
function scale() { [].forEach.call(document.querySelectorAll('.f'), function (f) { f.firstChild.style.transform = 'scale(' + f.clientWidth / 1920 + ')'; }); }
window.addEventListener('resize', scale); setTimeout(scale, 50);
</script>
</body>
</html>
