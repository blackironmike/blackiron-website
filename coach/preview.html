<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coach Board Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap">
<style>
body{margin:0;background:#000;color:#C7C7C7;font-family:Montserrat,Arial,sans-serif;padding:40px 5vw 80px}
h1{color:#fff;font-weight:900;text-transform:uppercase;font-size:clamp(28px,4vw,52px);margin:0 0 6px}
h2{color:#FFD202;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:15px;margin:48px 0 6px}
h3{color:#fff;font-weight:900;text-transform:uppercase;font-size:26px;margin:0 0 6px}
p{max-width:820px;line-height:1.5;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
a.t{display:block;text-decoration:none;color:#C7C7C7;border:1px solid #2A2A2A;background:#101010}
a.t:hover{border-color:#FFD202}
.f{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000}
.f iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.c{padding:12px 14px;font-weight:700;font-size:14px}
.c b{color:#fff;display:block;font-size:16px;text-transform:uppercase}
</style>
</head>
<body>
<h1>Coach board, three versions</h1>
<p>Every tile opens the real board. Click through sections, start the clock, try Clock settings and Auto clock. Keyboard: arrows for sections, space to start or pause, C for clock settings, A for auto clock. Programming shown is the week of Oct 12.</p>
<div id="out"></div>
<script>
var V = [
  ['1', 'Whiteboard', 'The workout reads like the whiteboard. Big list on the left, the clock in a column on the right, section tabs along the bottom.'],
  ['2', 'Rogue', 'The clock is the hero. A full-width timer band like the wall timer, the workout in columns underneath.'],
  ['3', 'Run of show', 'A class timeline down the left with a running class clock, the section in the middle, the clock and what’s next on the right.']
];
var SHOTS = [
  ['Warm up', 'date=2026-10-12&mode=board&class=9:30&section=1'],
  ['Weightlifting, EMOM', 'date=2026-10-12&mode=board&class=9:30&section=2'],
  ['Body building', 'date=2026-10-15&mode=board&class=9:30&section=3']
];
var SHARED = [
  ['Time until next class', 'Between classes. Shows the countdown, time of day, weather, and a button for today’s workout.', 'date=2026-10-12&time=08:14'],
  ['Welcome, then the warm-up', 'Plays at the start of each class. Opens on the warm-up with the clock ready.', 'date=2026-10-15&time=09:29:55'],
  ['End of day', 'After the last class and overnight. The branded centerpiece with the time, weather and next class.', 'date=2026-10-12&time=21:05'],
  ['Today’s workout (open gym)', 'Opened from the countdown or end of day screen. Closes itself after an hour.', 'date=2026-10-12&time=08:14&mode=overview']
];
function tile(href, title, sub) {
  return '<a class="t" href="/coach/?' + href + '" target="_blank"><div class="f"><iframe loading="lazy" src="/coach/?' + href + '&still=1" tabindex="-1"></iframe></div><div class="c"><b>' + title + '</b>' + (sub || '') + '</div></a>';
}
var h = '';
V.forEach(function (v) {
  h += '<h2>Version ' + v[0] + '</h2><h3>' + v[1] + '</h3><p>' + v[2] + '</p><div class="grid">' +
    SHOTS.map(function (s) { return tile('v=' + v[0] + '&' + s[1], s[0]); }).join('') + '</div>';
});
h += '<h2>Shared screens</h2><h3>Between classes and after hours</h3><p>These are the same in all three versions.</p><div class="grid">' +
  SHARED.map(function (s) { return tile('v=1&' + s[2], s[0], s[1]); }).join('') + '</div>';
document.getElementById('out').innerHTML = h;
function scale() { [].forEach.call(document.querySelectorAll('.f'), function (f) { f.firstChild.style.transform = 'scale(' + f.clientWidth / 1920 + ')'; }); }
window.addEventListener('resize', scale); setTimeout(scale, 50);
</script>
</body>
</html>
