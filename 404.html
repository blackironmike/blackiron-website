<!-- Lead form pop-up: every "Book a Free Consult" link opens the Lead Capture - Website form
     in place. The href stays as it was, so cmd-click, middle-click and a JS failure still work. -->
<div class="modal-overlay" id="leadModal">
    <div class="modal-container">
        <button class="modal-close" onclick="closeLeadModal()" aria-label="Close">&times;</button>
        <iframe
            data-src="https://api.leadconnectorhq.com/widget/form/vw0hMdDkTCL6K5N3i7vF"
            style="width:100%;height:100%;border:none;border-radius:4px"
            id="inline-vw0hMdDkTCL6K5N3i7vF"
            data-layout="{'id':'INLINE'}"
            data-trigger-type="alwaysShow"
            data-trigger-value=""
            data-activation-type="alwaysActivated"
            data-activation-value=""
            data-deactivation-type="neverDeactivate"
            data-deactivation-value=""
            data-form-name="Form 2"
            data-height="565"
            data-layout-iframe-id="inline-vw0hMdDkTCL6K5N3i7vF"
            data-form-id="vw0hMdDkTCL6K5N3i7vF"
            title="Form 2"
        ></iframe>
    </div>
</div>
<script>
function openLeadModal() {
    var modal = document.getElementById('leadModal');
    var iframe = modal.querySelector('iframe');
    if (iframe && !iframe.src && iframe.dataset.src) { iframe.src = iframe.dataset.src; }
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeLeadModal() {
    document.getElementById('leadModal').classList.remove('active');
    document.body.style.overflow = '';
}
document.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
    var t = e.target;
    var a = t && t.closest ? t.closest('a[href*="book.blackironathletics.com"]') : null;
    if (!a || !document.getElementById('leadModal')) { return; }
    e.preventDefault();
    openLeadModal();
});
document.getElementById('leadModal').addEventListener('click', function (e) {
    if (e.target === this) { closeLeadModal(); }
});
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeLeadModal(); }
});
</script>
<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript" defer></script>
